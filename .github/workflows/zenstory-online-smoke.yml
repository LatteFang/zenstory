name: zenstory Online Smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character main commit deployed by the providers"
        required: true
        type: string
      ci_run_id:
        description: "Exact successful CI workflow run ID for source_sha"
        required: true
        type: string
      frontend_origin:
        description: "Canonical public frontend origin"
        required: true
        default: "https://app.zenstory.ai"
        type: choice
        options:
        - "https://app.zenstory.ai"
        - "https://zenstory.ai"

permissions:
  contents: read

concurrency:
  group: zenstory-online-smoke-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Source-bound public readiness receipt
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
    - name: Require main dispatch and validate input shapes
      env:
        SOURCE_REF: ${{ github.ref }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        CI_RUN_ID: ${{ inputs.ci_run_id }}
      run: |
        [[ "$SOURCE_REF" == "refs/heads/main" ]] || {
          echo "::error::Readiness receipts must be dispatched from main."
          exit 1
        }
        [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || {
          echo "::error::source_sha must be a lowercase 40-character commit SHA."
          exit 1
        }
        [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || {
          echo "::error::ci_run_id must be numeric."
          exit 1
        }

    - name: Checkout trusted main receipt controls
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Prove exact source and successful CI summary
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        CI_RUN_ID: ${{ inputs.ci_run_id }}
      run: |
        mkdir -p artifacts
        node scripts/ci/deployment-receipt.mjs "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$CI_RUN_ID" artifacts/ci-proof.json

    - name: Checkout the proven provider source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
        clean: false

    - name: Run credential-free public readiness checks
      env:
        ZENSTORY_BACKEND_URL: https://api.zenstory.ai
        ZENSTORY_FRONTEND_URL: ${{ inputs.frontend_origin }}
        ZENSTORY_SMOKE_TIMEOUT_SECONDS: '120'
      run: |
        set -o pipefail
        bash scripts/ci/zenstory-online-smoke.sh 2>&1 | tee artifacts/zenstory-online-smoke.log

    - name: Write explicit provider receipt status
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        CI_RUN_ID: ${{ inputs.ci_run_id }}
        FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
      run: |
        node - <<'NODE'
        const { writeFileSync } = require('node:fs');
        writeFileSync('artifacts/deployment-receipt.json', `${JSON.stringify({
          schemaVersion: 1,
          sourceSha: process.env.SOURCE_SHA,
          ciRunId: Number(process.env.CI_RUN_ID),
          frontendOrigin: process.env.FRONTEND_ORIGIN,
          backendOrigin: 'https://api.zenstory.ai',
          readiness: 'SUCCESS',
          providerSourceBinding: 'NOT_VERIFIED',
          providerGate: 'NOT_VERIFIED',
          note: 'This is post-deployment public observability. Provider deployment IDs, source binding, and native promotion/deployment gates require separate readback.',
        }, null, 2)}\n`);
        NODE

    - name: Upload source-bound readiness evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: zenstory-readiness-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/
        if-no-files-found: error
        retention-days: 14
